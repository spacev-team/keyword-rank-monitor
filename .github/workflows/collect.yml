name: Collect
run-name: collect ${{ inputs.mode || 'scheduled' }}

# 스케줄 = cron 내장(토큰 제로 운영, 사용자 확정 2026-08-06). 원래 EMM 처럼 n8n →
# workflow_dispatch 구조였으나 org PAT 승인 대기 + 개인 토큰 과권한 문제로 전환.
# 이 프로젝트는 런마다 독립 스냅샷(run_id)이라 트리거 중복이 무해해 EMM 의
# 'cron 금지(중복 적재)' 원칙이 적용되지 않는다. GitHub cron 은 5~20분 지연될 수
# 있음(추세 프록시 용도라 허용). 분값 37 = 정시/30분 혼잡 회피(지연 완화).
on:
  schedule:
    - cron: "37 22 * * *"      # 07:37 KST — daily(구글 포함 전체)
    - cron: "37 2,7,12 * * *"  # 11:37/16:37/21:37 KST — core(구글 제외)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily(구글 포함 전체) | core(구글 제외) | probe(러너 IP 봇차단 점검 dry-run, 저장 없음)"
        required: true
        type: choice
        options: [daily, core, probe]

concurrency:
  group: krm-collect
  cancel-in-progress: false   # 동시 트리거는 취소 대신 직렬 대기

permissions:
  contents: write   # state 브랜치 push
  pages: write      # Pages 배포
  id-token: write   # actions/deploy-pages OIDC

env:
  TZ: Asia/Seoul    # '오늘'이 KST 기준 — UTC 러너 필수 보정

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # 240키워드 × 4~5엔진 순차(봇차단 회피 대기 포함) ≈ 45~60분
    steps:
      # schedule 이벤트는 inputs 가 없다 — cron 시각(UTC 22시대 = daily)으로 모드 결정.
      - name: Resolve mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$(date -u +%H)" = "22" ]; then
            MODE=daily
          else
            MODE=core
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "mode=$MODE"

      - uses: actions/checkout@v4

      # 순위 이력(SQLite)은 state 브랜치에 단일 커밋으로 보존 — 러너는 매회 복원한다.
      - name: Restore state (state branch -> data/)
        run: |
          if git fetch -q --depth 1 origin state; then
            git checkout -q FETCH_HEAD -- data
            ls -la data/
          else
            echo "no state branch yet (first run)"
          fi

      # 구글 인박스: 로컬 PC(거주지 IP) 브라우저 수집 결과. daily 런만 소비하며,
      # 브랜치/파일이 없거나 낡았으면 수집기가 알아서 blocked 로 강등한다.
      - name: Restore google inbox (google-serp branch -> data/)
        if: ${{ env.MODE == 'daily' }}
        run: |
          if git fetch -q --depth 1 origin google-serp; then
            git checkout -q FETCH_HEAD -- data/google_serp.json || echo "inbox 파일 없음"
            ls -la data/ || true
          else
            echo "no google-serp branch — SERPAPI_KEY 미설정이면 구글은 blocked 기록"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # .env 는 시크릿 KRM_DOTENV 에서 복원(웹훅·SerpAPI 키 등). 미설정이어도 동작 —
      # 알림 생략·구글 blocked 기록. tr -d '\r' = CRLF 시크릿 방어(EMM 07-07 실사고 교훈).
      - name: Restore credentials (optional)
        env:
          DOTENV: ${{ secrets.KRM_DOTENV }}
        run: |
          if [ -n "$DOTENV" ]; then
            printf '%s' "$DOTENV" | tr -d '\r' > .env
            echo ".env restored ($(wc -l < .env) lines)"
          else
            echo "KRM_DOTENV 미설정 — 기본값으로 실행(알림·Sheets·SerpAPI 없음)"
          fi

      - name: Run collectors
        id: collectors
        run: |
          case "$MODE" in
            daily) python run.py --mode daily ;;
            core)  python run.py --mode core ;;
            probe) python run.py --engines naver,daum --keywords 삼삼엠투,단기임대 --dry-run ;;
          esac

      - name: Export dashboard data
        if: ${{ !cancelled() && env.MODE != 'probe' }}
        run: python export_dashboard.py

      # 이력 DB 를 state 브랜치에 force-push(매회 단일 커밋 교체 — 히스토리 비대 없음).
      - name: Persist state
        if: ${{ !cancelled() && env.MODE != 'probe' }}
        run: |
          [ -f data/rank_history.sqlite ] || { echo "no state to persist"; exit 0; }
          T=$(mktemp -d)
          mkdir -p "$T/data"
          cp data/rank_history.sqlite "$T/data/"
          git -C "$T" init -qb state
          git -C "$T" add -A
          git -C "$T" -c user.name=krm-bot -c user.email=krm-bot@users.noreply.github.com \
            commit -qm "state: $(date '+%F %T %Z') mode=$MODE"
          git -C "$T" push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state

      - name: Upload Pages artifact
        if: ${{ !cancelled() && env.MODE != 'probe' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    if: ${{ inputs.mode != 'probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
