name: Pages
run-name: pages redeploy (docs 변경)

# 대시보드 UI(docs/**) 변경을 다음 수집 런까지 기다리지 않고 즉시 반영.
# docs/data/*.json 은 git 에 없으므로(state 브랜치의 SQLite 가 원본) 여기서 재생성한다.
# 수집 런(collect.yml)과 배포가 겹쳐도 Pages 는 마지막 배포가 이기므로 무해 —
# 데이터는 양쪽 다 같은 state 브랜치에서 나와 내용 차이가 없다.
on:
  push:
    branches: [main]
    paths: ["docs/**", "export_dashboard.py"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore state (state branch -> data/)
        run: |
          if git fetch -q --depth 1 origin state; then
            git checkout -q FETCH_HEAD -- data
          else
            echo "no state branch — 빈 데이터로 배포(첫 수집 전)"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # export_dashboard 의존은 requests 뿐(수집기 미실행) — 전체 requirements 불필요
      - run: pip install requests

      - name: Export dashboard data
        run: |
          if [ -f data/rank_history.sqlite ]; then
            python export_dashboard.py
          else
            mkdir -p docs/data
            echo '{"generated_at":null,"run_id":null,"self_name":"삼삼엠투","records":[]}' > docs/data/latest.json
            echo '{"generated_at":null,"days":[],"series":{}}' > docs/data/trends.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
