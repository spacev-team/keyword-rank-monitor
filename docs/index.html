<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼삼엠투 키워드 순위 모니터링</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <h1>삼삼엠투 키워드 순위 모니터링</h1>
    <div class="meta">
      <span id="generatedAt" class="generated-at">–</span>
    </div>
  </div>
</header>

<main class="container">
  <section aria-label="엔진별 요약">
    <div id="summaryCards" class="cards"></div>
  </section>

  <section aria-label="필터">
    <div class="filter-bar" id="filterBar">
      <select id="fEngine" title="엔진">
        <option value="">엔진 전체</option>
        <option value="naver">네이버</option>
        <option value="google">구글</option>
        <option value="daum">다음</option>
        <option value="playstore">플레이스토어</option>
        <option value="appstore">앱스토어</option>
      </select>
      <select id="fArea" title="영역">
        <option value="">영역 전체</option>
        <option value="ad">광고</option>
        <option value="organic">오가닉</option>
        <option value="app">앱</option>
      </select>
      <select id="fGroup" title="그룹">
        <option value="">그룹 전체</option>
        <option value="brand">브랜드</option>
        <option value="generic">일반</option>
      </select>
      <select id="fStatus" title="상태">
        <option value="">상태 전체</option>
        <option value="ok">정상</option>
        <option value="not_found">미노출</option>
        <option value="bad">수집이상(차단·오류 전체)</option>
        <option value="no_section">광고영역 없음</option>
        <option value="blocked">차단</option>
        <option value="parse_fail">구조변경 의심</option>
        <option value="error">수집오류</option>
      </select>
      <input type="search" id="fKeyword" placeholder="키워드 검색" autocomplete="off">
      <span id="rowCount" class="row-count"></span>
    </div>
  </section>

  <section aria-label="순위 테이블">
    <div class="table-wrap">
      <table id="rankTable">
        <thead>
          <tr>
            <th data-sort="keyword" class="sortable">키워드</th>
            <th>그룹</th>
            <th data-sort="sv" class="sortable num" title="네이버 키워드도구 최근 30일 검색수(PC+모바일) ÷ 30 = 일평균. 매일 아침 daily 런에서 갱신 — 클릭하면 검색량 큰 순 정렬">검색량/일</th>
            <th>엔진</th>
            <th>영역</th>
            <th data-sort="rank" class="sortable num" title="자사 순위 / 그 영역에서 확인한 결과 수 (예: 1위 / 20 = 20개 중 1위, 권외 / 20 = 20개 안에 없음)">순위</th>
            <th data-sort="delta" class="sortable" title="직전 수집 대비 순위 변동">변동</th>
            <th title="자사가 노출된 SERP 블록(파워링크·웹사이트·프리미엄링크 등) — 권외·차단이면 비어 있음">섹션</th>
            <th>상태</th>
            <th>추이</th>
            <th class="go">보러가기</th>
            <th>수집시각</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty-msg" hidden>조건에 맞는 데이터가 없습니다.</div>
      <p class="table-legend">
        <strong>검색량/일</strong> = 네이버 최근 30일 검색수 ÷ 30 (키워드도구 기준, 셀에 마우스 올리면 30일 총량) ·
        <strong>순위</strong> 1위 / 20 = 확인한 20개 결과 중 1위, 권외 / 20 = 20개 안에 미노출 ·
        <strong>섹션</strong> = 자사가 노출된 SERP 블록(권외·차단 시 없음) ·
        <strong>차단</strong> = 수집 차단(순위 아님) — 열 제목에 마우스를 올리면 설명이 보입니다.
      </p>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button type="button" class="modal-close" data-close aria-label="닫기">&times;</button>
    </div>
    <div class="chart-box"><canvas id="modalChart"></canvas></div>
    <div id="modalLinks" class="modal-links"></div>
  </div>
</div>

<div id="kwModal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="kwModalTitle">
    <div class="modal-head">
      <h2 id="kwModalTitle"></h2>
      <button type="button" class="modal-close" data-close aria-label="닫기">&times;</button>
    </div>
    <p id="kwModalDesc" class="kw-desc"></p>
    <div id="kwModalChips" class="kw-chips"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
